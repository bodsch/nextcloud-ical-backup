# Continuous integration: smoke build of the Go module.
# Runs on every push to main, on merge/pull requests, and on manual dispatch.
# Does NOT publish anything - releasing is handled by release.yml.
# Code formatting, linting, and testing is handled by pre-commit hooks (see .pre-commit-config.yaml).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Go mod download
        run: go mod download

      - name: Go mod verify
        run: go mod verify

      - name: go vet
        run: make vet

      - name: govulncheck
        run: make vuln

      - name: Test (race detector)
        run: make test

      - name: Build
        run: |
          make build
          bin/nextcloud-ical-backup --version

      # - name: Build (smoke)
      #   run: |
      #     go build -trimpath -o /tmp/nextcloud-ical-backup ./cmd/nextcloud-ical-backup
      #     /tmp/nextcloud-ical-backup --version
